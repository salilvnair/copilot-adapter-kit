<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="__CSP__">
<title>Copilot Adapter Kit</title>
<style>
:root {
  --color-primary: #6366f1; --color-primary-hover: #818cf8;
  --color-surface: #1e1e1e; --color-surface-hover: #2a2d2e; --color-elevated: #252526;
  --color-panel: #181818; --color-input-bg: #2d2d2d; --color-input-border: #3c3c3c;
  --color-text-primary: #d4d4d4; --color-text-secondary: #acacac; --color-text-muted: #6d6d6d;
  --color-success: #22c55e; --color-warning: #f59e0b; --color-error: #ef4444;
  --color-info: #3b82f6; --color-accent-purple: #a78bfa;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--color-surface);color:var(--color-text-primary);height:100vh;overflow:hidden;display:flex;flex-direction:column}

.header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--color-panel);border-bottom:1px solid rgba(255,255,255,.06);flex-shrink:0}
.header-logo{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,#6C5CE7,#00CEC9);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff}
.header-title{font-size:14px;font-weight:600}
.header-badge{font-size:10px;padding:2px 7px;border-radius:999px;background:rgba(99,102,241,.15);color:var(--color-primary);font-weight:600}

.main-layout{display:flex;flex:1;overflow:hidden}
.sidebar{width:200px;min-width:200px;background:var(--color-panel);border-right:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0}
.sidebar-section{padding:8px 10px 2px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--color-text-muted)}
.sidebar-tab{display:flex;align-items:center;gap:8px;padding:10px 12px;margin:1px 6px;border-radius:8px;font-size:12.5px;color:var(--color-text-secondary);cursor:pointer;transition:all 120ms ease;user-select:none}
.sidebar-tab:hover{background:rgba(255,255,255,.04);color:var(--color-text-primary)}
.sidebar-tab.active{background:rgba(99,102,241,.12);color:var(--color-primary);font-weight:600}
.sidebar-tab .tab-icon{font-size:22px;width:28px;text-align:center;line-height:1}
.sidebar-tab .tab-badge{margin-left:auto;font-size:10px;padding:1px 6px;border-radius:999px;background:rgba(255,255,255,.08);color:var(--color-text-muted)}
.sidebar-tab.active .tab-badge{background:rgba(99,102,241,.2);color:var(--color-primary)}

.content{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:16px}
.content-title{font-size:16px;font-weight:700}
.content-subtitle{font-size:12px;color:var(--color-text-muted);margin-top:-10px}

.card{background:var(--color-elevated);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:16px}
.card-header{font-size:13px;font-weight:600;margin-bottom:12px}

.form-group{margin-bottom:12px}
.form-label{display:block;font-size:11px;font-weight:600;color:var(--color-text-secondary);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
.form-input{width:100%;padding:8px 12px;font-size:13px;background:var(--color-input-bg);border:1px solid var(--color-input-border);border-radius:8px;color:var(--color-text-primary);outline:none;transition:border-color 140ms,box-shadow 140ms}
.form-input:focus{border-color:var(--color-primary);box-shadow:0 0 0 3px rgba(99,102,241,.15)}
.form-input::placeholder{color:var(--color-text-muted)}
.form-input.sm{padding:6px 10px;font-size:12px}
.form-row{display:flex;gap:10px}.form-row>*{flex:1}
.inline-row{display:flex;align-items:center;gap:10px}

.dropdown-wrap{position:relative}
.dropdown-trigger{width:100%;padding:8px 12px;font-size:13px;background:var(--color-input-bg);border:1px solid var(--color-input-border);border-radius:8px;color:var(--color-text-primary);cursor:pointer;display:flex;align-items:center;justify-content:space-between;transition:border-color 140ms,box-shadow 140ms;user-select:none}
.dropdown-trigger.open{border-color:var(--color-primary);box-shadow:0 0 0 3px rgba(99,102,241,.15)}
.dropdown-trigger.sm{padding:6px 10px;font-size:12px}
.dropdown-arrow{font-size:10px;color:var(--color-text-muted);transition:transform 140ms}
.dropdown-trigger.open .dropdown-arrow{transform:rotate(180deg)}
.dropdown-menu{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:999;background:#1e1e1e;border:1px solid rgba(255,255,255,.1);border-radius:10px;max-height:220px;overflow-y:auto;animation:dd-in 120ms ease-out;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.dropdown-menu.flip-up{top:auto;bottom:calc(100% + 4px);animation:dd-in-up 120ms ease-out}
@keyframes dd-in{from{opacity:0;transform:translateY(-4px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes dd-in-up{from{opacity:0;transform:translateY(4px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.dropdown-item{padding:8px 12px;font-size:12.5px;cursor:pointer;transition:background 100ms;color:var(--color-text-secondary)}
.dropdown-item:hover{background:rgba(99,102,241,.08);color:#e5e7eb}
.dropdown-item.selected{color:var(--color-primary);font-weight:600}

.checkbox-wrap{display:flex;align-items:center;gap:8px;cursor:pointer;padding:6px 0;user-select:none}
.checkbox-box{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--color-input-border);display:flex;align-items:center;justify-content:center;transition:all 140ms;flex-shrink:0}
.checkbox-wrap:hover .checkbox-box{border-color:var(--color-primary)}
.checkbox-box.checked{background:var(--color-primary);border-color:var(--color-primary);box-shadow:0 0 0 3px rgba(99,102,241,.15)}
.checkbox-icon{width:11px;height:11px;stroke:#fff;stroke-width:2.5;display:none}
.checkbox-box.checked .checkbox-icon{display:block}
.checkbox-label{font-size:12.5px}

.icon-svg{width:14px;height:14px;flex-shrink:0}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;padding:2px 8px;border-radius:999px;font-weight:600;white-space:nowrap}
.badge-primary{background:rgba(99,102,241,.15);color:var(--color-primary)}
.badge-success{background:rgba(34,197,94,.12);color:var(--color-success)}
.badge-warning{background:rgba(245,158,11,.12);color:var(--color-warning)}
.badge-error{background:rgba(239,68,68,.12);color:var(--color-error)}
.badge-info{background:rgba(59,130,246,.12);color:var(--color-info)}
.badge-purple{background:rgba(167,139,250,.12);color:var(--color-accent-purple)}
.badge-muted{background:rgba(255,255,255,.06);color:var(--color-text-muted)}

.btn{padding:8px 16px;font-size:12px;font-weight:600;border:none;border-radius:8px;cursor:pointer;transition:all 140ms;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--color-primary);color:#fff}
.btn-primary:hover{background:var(--color-primary-hover);box-shadow:0 0 0 3px rgba(99,102,241,.18)}
.btn-danger{background:rgba(239,68,68,.12);color:var(--color-error)}
.btn-danger:hover{background:rgba(239,68,68,.22)}
.btn-sm{padding:5px 10px;font-size:11px;border-radius:6px}
.btn-ghost{background:transparent;color:var(--color-text-secondary);border:1px solid rgba(255,255,255,.08)}
.btn-ghost:hover{background:rgba(255,255,255,.04);color:var(--color-text-primary)}
.btn-icon{padding:5px;min-width:28px;justify-content:center}

.provider-card{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--color-input-bg);border:1px solid rgba(255,255,255,.06);border-radius:10px;margin-bottom:8px;transition:border-color 140ms}
.provider-card:hover{border-color:rgba(255,255,255,.12)}
.provider-info{flex:1}
.provider-name{font-size:13px;font-weight:600}
.provider-url{font-size:11px;color:var(--color-text-muted);margin-top:2px}
.provider-actions{display:flex;gap:6px}

.model-row{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--color-input-bg);border:1px solid rgba(255,255,255,.06);border-radius:8px;margin-bottom:6px;font-size:12.5px;transition:all 140ms;flex-wrap:wrap}
.model-row:hover{border-color:rgba(255,255,255,.12)}
.model-row.disabled{opacity:.45}
.model-row .model-info{flex:1;display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.model-row .model-name{font-weight:600;white-space:nowrap}
.model-row .model-family{color:var(--color-text-muted);font-size:11px;white-space:nowrap}
.model-row .model-actions{display:flex;align-items:center;gap:4px;flex-shrink:0}
.model-builtin-badge{font-size:9px;padding:1px 5px;border-radius:999px;background:rgba(99,102,241,.12);color:var(--color-primary);font-weight:600;white-space:nowrap}

.toast{position:fixed;bottom:24px;right:24px;padding:10px 18px;border-radius:10px;font-size:12.5px;background:var(--color-elevated);border:1px solid rgba(255,255,255,.1);color:var(--color-text-primary);box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:9999;animation:toast-in 200ms ease-out;display:flex;align-items:center;gap:8px}
@keyframes toast-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9998;display:flex;align-items:center;justify-content:center;animation:fade-in 140ms ease-out}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
.modal-box{background:var(--color-elevated);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:24px;max-width:380px;width:90%;box-shadow:0 16px 48px rgba(0,0,0,.5);animation:modal-in 160ms ease-out}
@keyframes modal-in{from{opacity:0;transform:scale(.95) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal-title{font-size:15px;font-weight:700;margin-bottom:6px}
.modal-body{font-size:13px;color:var(--color-text-secondary);margin-bottom:20px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end}
.hidden{display:none!important}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:3px}
</style>
</head>
<body>
<div class="header"><img src="__ICON_URI__" width="28" height="28" style="border-radius:6px" alt=""/><span class="header-title">Copilot Adapter Kit</span><span class="header-badge">v0.1</span></div>
<div class="main-layout">
<div class="sidebar" id="sidebar">
<div class="sidebar-section">Providers</div>
<div class="sidebar-tab active" data-tab="providers"><span class="tab-icon" id="icoProv"></span>Providers<span class="tab-badge" id="provCount">0</span></div>
<div class="sidebar-section" style="margin-top:4px">Models</div>
<div class="sidebar-tab" data-tab="models"><span class="tab-icon">🧩</span>Manage Models<span class="tab-badge" id="modelCount">0</span></div>
<div class="sidebar-section" style="margin-top:4px">Keys</div>
<div class="sidebar-tab" data-tab="keys"><span class="tab-icon">🔑</span>API Keys</div>
<div class="sidebar-section" style="margin-top:4px">Settings</div>
<div class="sidebar-tab" data-tab="config"><span class="tab-icon">⚙️</span>Configuration</div>
<div class="sidebar-section" style="margin-top:4px">Tools</div>
<div class="sidebar-tab" data-tab="json"><span class="tab-icon">{ }</span>JSON Settings</div>
<div class="sidebar-tab" data-tab="dumps"><span class="tab-icon">📂</span>Request Dumps</div>
<div class="sidebar-section" style="margin-top:8px">Danger</div>
<div class="sidebar-tab" data-tab="danger"><span class="tab-icon">⚠️</span>Danger Zone</div>
</div>
<div class="content" id="content"></div>
<div class="toast hidden" id="toast"></div>
</div>

<script>
const vsc=acquireVsCodeApi();
let st={providers:{},models:[],builtinModels:[],maxTokens:0,logLevel:'quiet',stabilizeTools:false,hiddenBuiltins:[],hiddenCustomModels:[],keys:{}};
let active='providers';

// SVG icons — exact Daakia paths (24x24 viewBox, rendered at 14px)
function iTrash(c){const s=c||'var(--color-error)';return`<svg class="icon-svg" style="stroke:${s};fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>`}
function iEdit(){return`<svg class="icon-svg" style="stroke:var(--color-text-secondary);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round" viewBox="0 0 24 24"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>`}
function iEye(){return`<svg class="icon-svg" style="stroke:var(--color-success);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`}
function iEyeOff(){return`<svg class="icon-svg" style="stroke:var(--color-text-muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round" viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`}
function iGear(){return`<svg class="icon-svg" style="stroke:var(--color-text-secondary);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>`}
function iGlobe(){return`<svg class="icon-svg" style="stroke:var(--color-text-secondary);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>`}
function iPlus(){return`<svg class="icon-svg" style="stroke:var(--color-text-primary);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`}
function iFolder(){return`<svg class="icon-svg" style="stroke:var(--color-info);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>`}
function iCak(size){const s=size||32;return`<svg width="${s}" height="${s}" viewBox="0 0 128 128"><rect width="128" height="128" rx="24" fill="none"/><polygon points="64,20 102,42 102,86 64,108 26,86 26,42" fill="none" stroke="#6366f1" stroke-width="4" stroke-linejoin="round"/><polygon points="64,38 90,52 90,80 64,94 38,80 38,52" fill="none" stroke="#818cf8" stroke-width="3.5" stroke-linejoin="round"/><circle cx="64" cy="20" r="4" fill="#a78bfa"/><circle cx="102" cy="42" r="4" fill="#6366f1"/><circle cx="102" cy="86" r="4" fill="#00cec9"/><circle cx="64" cy="108" r="4" fill="#55efc4"/><circle cx="26" cy="86" r="4" fill="#6366f1"/><circle cx="26" cy="42" r="4" fill="#a78bfa"/><circle cx="64" cy="64" r="5" fill="#d4d4d4"/><circle cx="64" cy="64" r="2.5" fill="#1e1e1e"/></svg>`}

document.getElementById('sidebar').addEventListener('click',e=>{
  const t=e.target.closest('.sidebar-tab');if(!t)return;
  document.querySelectorAll('.sidebar-tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');active=t.dataset.tab;render();
});

function render(){
  const c=document.getElementById('content');
  switch(active){case'providers':c.innerHTML=rProv();break;case'models':c.innerHTML=rMod();break;case'keys':c.innerHTML=rKeys();break;case'config':c.innerHTML=rCfg();break;case'json':c.innerHTML=rJson();break;case'dumps':c.innerHTML=`<div class="content-title">📂 Request Dumps</div><div class="content-subtitle">Payloads saved when log level = dump</div><div><button class="btn btn-ghost" onclick="vsc.postMessage({type:'openDumps'})">${iFolder()} Open Dumps Folder</button></div><div style="margin-top:12px;color:var(--color-text-muted);font-size:12px">Set log level to "dump" in Configuration tab.</div>`;break;case'danger':c.innerHTML=rDanger();}
  updBadges();rebindDD();
}

// --- Providers ---
function rProv(){
  const e=Object.entries(st.providers);
  const cards=e.map(([f,cfg])=>`<div class="provider-card">
    <div class="provider-info"><div class="provider-name"><span class="badge badge-primary" style="margin-right:6px">${esc(f)}</span>${esc(cfg.name||f)}${st.keys[f]?' <span class="badge badge-success">🔑 key set</span>':' <span class="badge badge-warning">no key</span>'}</div><div class="provider-url">${esc(cfg.baseUrl||'')}</div></div>
    <div class="provider-actions">
      <button class="btn btn-sm btn-ghost btn-icon" title="Edit" onclick="edProv('${esc(f)}')">${iEdit()}</button>
      <button class="btn btn-sm btn-danger btn-icon" title="Remove" onclick="rmProv('${esc(f)}')">${iTrash()}</button>
    </div></div>`).join('');
  return`<div class="content-title">🌐 Providers</div><div class="content-subtitle">${e.length} configured</div>
    ${cards||'<div style="color:var(--color-text-muted);padding:12px 0">No providers yet.</div>'}
    <div class="card"><div class="card-header">➕ Add Provider</div>
    <div class="form-row"><div class="form-group"><label class="form-label">Family</label><div class="dropdown-wrap" id="ddProvFamily"></div></div><div class="form-group"><label class="form-label">Provider Name</label><input class="form-input sm" id="pfName" placeholder="My OpenAI"></div><div class="form-group" style="flex:2"><label class="form-label">Base URL</label><input class="form-input sm" id="pfU" placeholder="https://api.example.com/v1"></div></div>
    <div class="form-group"><label class="form-label">Aliases (pickId=apiName, ...)</label><input class="form-input sm" id="pfA" placeholder="gpt-4o=gpt-4o-2024-08-06"></div>
    <button class="btn btn-primary btn-sm" onclick="addProv()">${iPlus()} Add</button></div>`;
}

// --- Manage Models ---
let modelFilter = '';
function rMod(){
  const hs=new Set(st.hiddenBuiltins||[]);
  const provKeys = Object.keys(st.providers);
  if (!provKeys.length) return `<div class="content-title">🧩 Manage Models</div><div class="content-subtitle">No providers configured. Add one in the Providers tab first.</div>`;
  const filter = modelFilter || provKeys[0];

  const blt=(st.builtinModels||[]).filter(m=>!filter||m.family===filter).map(m=>{const hid=hs.has(m.id);const ap=m.apiPath||'/chat/completions';const apCls=ap==='/responses'?'badge badge-purple':'badge badge-muted';const pname=(st.providers[m.family]||{}).name||m.family;return`<div class="model-row${hid?' disabled':''}">
    <div class="model-info"><span class="model-name">${esc(m.name)} <span class="model-builtin-badge">built‑in</span></span><span class="badge badge-primary">${esc(m.family)}</span><span class="model-family">${esc(pname)}</span>
      <span class="${apCls}">${ap}</span>
      <span class="badge badge-primary">${(m.maxIn/1000)|0}K→${(m.maxOut/1000)|0}K</span>${m.image?'<span class="badge badge-info">vision</span>':''}${m.thinking?'<span class="badge badge-purple">thinking</span>':''}<span class="badge badge-muted">🔧 ${m.toolCalling}</span></div>
    <div class="model-actions">
      <button class="btn btn-sm btn-ghost btn-icon" title="Edit" onclick="edBlt('${esc(m.id)}')">${iEdit()}</button>
      <button class="btn btn-sm btn-ghost btn-icon" title="${hid?'Show':'Hide'}" onclick="togBlt('${esc(m.id)}')">${hid?iEyeOff():iEye()}</button>
      <button class="btn btn-sm btn-danger btn-icon" title="Delete" onclick="delBlt('${esc(m.id)}')">${iTrash()}</button>
    </div></div>`}).join('');
  const cust=(st.models||[]).filter(m=>!filter||m.family===filter).map(m=>{const hid=(st.hiddenCustomModels||[]).includes(m.family+':'+m.id);const ap=m.apiPath||'/chat/completions';const apCls=ap==='/responses'?'badge badge-purple':'badge badge-muted';const pname=(st.providers[m.family]||{}).name||m.family;return`<div class="model-row${hid?' disabled':''}"><div class="model-info"><span class="model-name">${esc(m.name||m.id)}</span><span class="badge badge-primary">${esc(m.family)}</span><span class="model-family">${esc(pname)}</span>
      <span class="${apCls}">${ap}</span>

// --- Dropdown System ---
window._ddReg = {};
window._openDD = null;

function ddMake(id, opts, sel, onCh) {
  const wrap = document.getElementById(id);
  if (!wrap) return;
  let val = String(sel);
  let open = false;

  function refresh() {
    const cur = opts.find(o => String(o.v||o.value) === val) || { l: val, label: val };
    let h = `<div class="dropdown-trigger sm${open?' open':''}" onclick="event.stopPropagation();window._ddReg['${id}'].toggle()"><span>${cur.l||cur.label}</span><span class="dropdown-arrow">▼</span></div>`;
    if (open) {
      h += `<div class="dropdown-menu" id="${id}-menu">${opts.map(o => `<div class="dropdown-item${String(o.v||o.value)===val?' selected':''}" onclick="event.stopPropagation();window._ddReg['${id}'].pick('${o.v||o.value}')">${o.l||o.label}</div>`).join('')}</div>`;
    }
    wrap.innerHTML = h;
    // Viewport check: flip up if not enough space below
    if (open) {
      requestAnimationFrame(() => {
        const menu = document.getElementById(id+'-menu');
        if (!menu) return;
        const r = menu.getBoundingClientRect();
        if (r.bottom > window.innerHeight - 8) { menu.classList.add('flip-up'); }
      });
    }
  }

  const inst = {
    get value() { return val; },
    set value(v) { val = v; refresh(); if (onCh) onCh(v); },
    options: opts, refresh,
    close() { open = false; refresh(); },
    toggle() {
      const prev = window._openDD;
      if (prev && prev !== wrap && prev._inst) { prev._inst.close(); }
      open = !open; refresh();
      window._openDD = open ? wrap : null;
    },
    pick(v) {
      val = v; open = false; refresh(); window._openDD = null;
      if (onCh) onCh(v);
    }
  };
  wrap._inst = inst;
  window._ddReg[id] = inst;
  refresh();
  return inst;
}

document.addEventListener('click', function() {
  if (window._openDD && window._openDD._inst) { window._openDD._inst.close(); window._openDD = null; }
});

function rebindDD() {
  document.querySelectorAll('.dropdown-wrap').forEach(d => {
    d.innerHTML = '';
    if (d._inst) { d._inst.close(); delete d._inst; }
  });
  if (active === 'providers') {
    const engFams = (st.engineFamilies || ['openai']);
    ddProvFamily = ddMake('ddProvFamily', engFams.map(f=>({v:f,l:f})), engFams[0]);
  }
  if (active === 'models') {
    const fams = Object.keys(st.providers); if (!fams.length) fams.push('openai');
    const famLabels = fams.map(f => ({ v: f, l: (st.providers[f]||{}).name || f }));
    ddMake('ddModelFilter', famLabels, modelFilter || fams[0], function(v){modelFilter=v;render();});
    dF = ddMake('ddMF', fams.map(f => ({ v: f, l: f })), fams[0]);
    dC = ddMake('ddMC', [{ v: '4096', l: '4K' }, { v: '8192', l: '8K' }, { v: '16384', l: '16K' }, { v: '32768', l: '32K' }, { v: '65536', l: '64K' }, { v: '128000', l: '128K' }, { v: '200000', l: '200K' }, { v: '400000', l: '400K' }, { v: '1000000', l: '1M' }], '128000');
    dO = ddMake('ddMO', [{ v: '4096', l: '4K' }, { v: '8192', l: '8K' }, { v: '16384', l: '16K' }, { v: '32768', l: '32K' }, { v: '65536', l: '64K' }, { v: '128000', l: '128K' }], '16384');
    dT = ddMake('ddMT', [{ v: '0', l: 'None' }, { v: '16', l: '16' }, { v: '32', l: '32' }, { v: '64', l: '64' }, { v: '128', l: '128' }], '128');
    dAP = ddMake('ddMAP', [{ v: '/chat/completions', l: '/chat/completions' }, { v: '/responses', l: '/responses' }], '/chat/completions');
    cV = bindCb('cbVis', true); cT = bindCb('cbThk', false);
  }
  if (active === 'config') {
    ddMake('ddLog', [{ v: 'quiet', l: '🔇 Quiet' }, { v: 'meta', l: '📋 Meta' }, { v: 'dump', l: '💾 Dump' }], st.logLevel || 'quiet', function(v) {
      vsc.postMessage({ type: 'saveConfig', payload: { key: 'logLevel', value: v } }); toast('✅ Log: ' + v);
    });
    const cs = bindCb('cbStab', st.stabilizeTools);
    cs.el.addEventListener('click', function() {
      vsc.postMessage({ type: 'saveConfig', payload: { key: 'stabilizeTools', value: cs.checked } }); toast('✅ Stabilize: ' + (cs.checked ? 'ON' : 'OFF'));
    });
  }
  if (active === 'keys') {
    const fams = Object.keys(st.providers); if (!fams.length) return;
    ddKeyProv = ddMake('ddKeyProv', fams.map(f => ({ v: f, l: (st.providers[f]||{}).name || f })), fams[0]);
  }
}

// --- Checkbox ---
function bindCb(id,init){const el=document.getElementById(id);if(!el)return{checked:false,el};let c=!!init;const lbl=el.querySelector('.checkbox-label')?.outerHTML||'';function rf(){el.innerHTML=`<div class="checkbox-box${c?' checked':''}"><svg class="checkbox-icon" viewBox="0 0 11 11"><path d="M2 5.5L4.5 8L9 3"/></svg></div>${lbl}`}el.addEventListener('click',e=>{if(e.target.closest('.checkbox-box')){c=!c;rf()}});el._cb={get checked(){return c},set checked(v){c=v;rf()},el,refresh:rf};rf();return el._cb}

function addProv(){const f=ddProvFamily?ddProvFamily.value:'';const nm=gid('pfName').value.trim();const u=gid('pfU').value.trim(),a=gid('pfA').value.trim();if(!f||!u)return toast('❌ Family & URL required');const ma={};if(a)a.split(',').forEach(p=>{const[k,...v]=p.trim().split('=');if(k&&v.length)ma[k.trim()]=v.join('=').trim()});vsc.postMessage({type:'saveProvider',payload:{family:f,config:{name:nm||f,baseUrl:u,modelAlias:ma}}});gid('pfName').value='';gid('pfU').value='';gid('pfA').value='';toast('✅ Provider added');resetProvBtn()}

function resetProvBtn(){const btn=document.querySelector('#content button.btn-primary');if(btn){btn.innerHTML=iPlus()+' Add';btn.onclick=addProv};gid('pfName').value='';gid('pfU').value='';gid('pfA').value=''}
function rmProv(f){const nm=(st.providers[f]||{}).name||f;const mc=(st.models||[]).filter(m=>m.family===f).length;const hk=st.keys[f];const w=[];if(mc)w.push(mc+' model(s)');if(hk)w.push('API key');const body=w.length?'⚠️ Also deletes: '+w.join(' and ')+'. Cannot be undone.':'Cannot be undone.';confirmModal('Delete '+nm+'?',body,()=>{vsc.postMessage({type:'removeProvider',payload:{family:f}});toast('🗑 Deleted')})}

// --- Helpers ---
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2200)}
function confirmModal(title,body,onOk){
  const ov=document.createElement('div');ov.className='modal-overlay';ov.innerHTML=`<div class="modal-box"><div class="modal-title">${title}</div><div class="modal-body">${body}</div><div class="modal-actions"><button class="btn btn-ghost btn-sm" id="modalCancel">Cancel</button><button class="btn btn-danger btn-sm" id="modalOk">Delete</button></div></div>`;
  document.body.appendChild(ov);
  document.getElementById('modalCancel').onclick=()=>ov.remove();
  document.getElementById('modalOk').onclick=()=>{ov.remove();onOk();};
  ov.addEventListener('click',e=>{if(e.target===ov)ov.remove()});
}
