<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
<title>CAK Git</title>
<style>
:root{--bg:#1e1e1e;--surface:#252526;--input:#2d2d2d;--border:#3c3c3c;--text:#d4d4d4;--muted:#888;--primary:#6366f1;--primary-hover:#818cf8;--success:#22c55e;--error:#ef4444;--warning:#f59e0b;--info:#3b82f6}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100vh;overflow:hidden;font-size:12px}
.input-area{padding:8px 8px 4px;flex-shrink:0}
.input-wrap{position:relative;display:flex}
.input-area textarea{flex:1;background:var(--input);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:7px 34px 7px 8px;font-size:11px;font-family:inherit;resize:none;height:38px;outline:none;line-height:1.4}
.input-area textarea:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(99,102,241,.15)}
.input-area textarea::placeholder{color:var(--muted)}
.sparkle-btn{position:absolute;right:3px;top:50%;transform:translateY(-50%);background:transparent;color:#f0f0f0;border:none;border-radius:5px;width:26px;height:26px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;line-height:1;transition:all 120ms;z-index:2}
.sparkle-btn:hover{background:rgba(74, 220, 186, 0.43);color:#fff;box-shadow:0 0 8px rgba(94,168,242,.3)}
.sparkle-btn:disabled{background:transparent;color:rgba(255,255,255,.08);cursor:not-allowed}
.spinner{animation:spin .8s linear infinite}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.dd-row{padding:8px 8px 4px;display:flex;align-items:center;gap:8px;font-size:10px;color:var(--muted);flex-shrink:0}
.dropdown-wrap{position:relative;min-width:110px}
.dropdown-trigger{padding:5px 10px;font-size:10px;background:var(--input);border:1px solid var(--border);border-radius:6px;color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:space-between;transition:border-color 140ms;user-select:none}
.dropdown-trigger.open{border-color:var(--primary);box-shadow:0 0 0 2px rgba(99,102,241,.15)}
.dropdown-arrow{font-size:8px;color:var(--muted);transition:transform 140ms;margin-left:10px}
.dropdown-trigger.open .dropdown-arrow{transform:rotate(180deg)}
.dropdown-menu{position:absolute;top:calc(100% + 3px);left:0;right:0;z-index:999;background:#1e1e1e;border:1px solid rgba(255,255,255,.1);border-radius:8px;max-height:180px;overflow-y:auto;animation:dd-in 120ms ease-out;box-shadow:0 6px 18px rgba(0,0,0,.5)}
@keyframes dd-in{from{opacity:0;transform:translateY(-3px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.dropdown-item{padding:6px 10px;font-size:11px;cursor:pointer;transition:background 100ms;color:var(--muted)}
.dropdown-item:hover{background:rgba(99,102,241,.08);color:#e5e7eb}
.dropdown-item.selected{color:var(--primary);font-weight:600}
.result-area{padding:8px 8px 4px;flex-shrink:0;min-height:0;display:flex;flex-direction:column;align-items:stretch}
.result-area .loading{color:var(--muted);font-size:11px;padding:4px 8px;display:flex;align-items:center;gap:6px}
.result-area .error{color:var(--error);font-size:11px;padding:4px 8px}

/* ── Card shared ── */
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;flex-shrink:0}
.card-header-actions{display:flex;gap:4px}
.chevron-btn{width:22px;height:22px;border:none;border-radius:5px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 120ms;background:transparent;color:rgba(255,255,255,.2);flex-shrink:0}
.chevron-btn:hover{background:rgba(99,102,241,.12);color:var(--primary)}
.chevron-btn svg{transition:transform 180ms}
.collapsed .chevron-btn svg{transform:rotate(-90deg)}
.action-btn{width:24px;height:24px;border:none;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;transition:all 120ms}
.copy-btn{color:#fbbf24;background:rgba(251,191,36,.1)}
.copy-btn:hover{color:#fcd34d;background:rgba(251,191,36,.2)}
.copy-btn.copied{color:var(--success)!important}
.clear-btn{color:#f87171;background:rgba(248,113,113,.1)}
.clear-btn:hover{color:#fca5a5;background:rgba(248,113,113,.25)}

/* ── Commit-msg card ── */
.msg-card{background:#2a2d2e;border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:12px 14px;animation:card-in 180ms ease-out;box-shadow:0 4px 16px rgba(0,0,0,.25);display:flex;flex-direction:column;min-height:0;width:100%}
@keyframes card-in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.msg-scroll{flex:1 1 0%;overflow-y:auto;min-height:0}
.msg-footer{flex-shrink:0;margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:6px}
.msg-card .msg-md-wrap{font-size:12.5px;line-height:1.7;color:#e4e4e7}
.msg-card .card-badge{display:inline-flex;align-items:center;gap:4px;font-size:9px;padding:2px 8px;border-radius:999px;font-weight:600;margin-top:10px}
.msg-card.collapsed .msg-scroll,.msg-card.collapsed .msg-footer{display:none}
.msg-card.collapsed{padding:4px 10px}
.msg-card.collapsed .card-header{margin-bottom:0}
.msg-card.collapsed .chevron-btn{width:18px;height:18px}
.msg-card.collapsed .action-btn{width:20px;height:20px;font-size:9px}

/* ── Audit card ── */
.audit-area{display:none;padding:0 8px 8px;flex-shrink:0}
.audit-area.show{display:block}
.audit-card{background:#1a1c1e;border:1px solid rgba(139,92,246,.15);border-radius:10px;padding:12px 14px;max-height:50vh;overflow-y:auto;animation:card-in 180ms ease-out;box-shadow:0 0 0 1px rgba(139,92,246,.06);display:flex;flex-direction:column}
.audit-card .mdv-root{font-size:11.5px}
.audit-card .mdv-root table{font-size:10.5px}
.audit-card .mdv-root pre{font-size:10px}
.audit-card.collapsed{max-height:none;overflow:hidden;padding:4px 10px}
.audit-card.collapsed #auditContent{display:none}
.audit-card.collapsed .card-header{margin-bottom:0}
.audit-card.collapsed .chevron-btn{width:18px;height:18px}
/* Audit toggle btn in dd-row */
.audit-btn{width:24px;height:24px;border:none;border-radius:5px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 120ms;background:rgba(255,255,255,.04);color:rgba(255,255,255,.25);flex-shrink:0;margin-left:4px}
.audit-btn:hover{background:rgba(99,102,241,.1);color:rgba(255,255,255,.6)}
.audit-btn.active{background:rgba(99,102,241,.18);color:var(--primary);box-shadow:0 0 0 1px rgba(99,102,241,.25)}
.splitter-wrap{position:relative;flex-shrink:0;z-index:10}
.splitter-bar{height:6px;cursor:row-resize;display:flex;align-items:center;justify-content:center;user-select:none}
.splitter-bar .splitter-line{height:3px;border-radius:3px;width:44px;background:rgba(255,255,255,.08);transition:all 150ms}
.splitter-bar:hover .splitter-line,.splitter-bar.dragging .splitter-line{width:80px;background:var(--primary)}
.splitter-tip{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:var(--surface);color:var(--text);font-size:10px;padding:4px 10px;border-radius:6px;border:1px solid var(--border);white-space:nowrap;pointer-events:none;z-index:50;display:none}
.splitter-wrap:hover .splitter-tip{display:block}
.diff-area{overflow-y:auto;padding:4px 8px;flex:1 1 0%}
.badge-row{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px}
.badge{display:inline-flex;align-items:center;gap:3px;font-size:10px;padding:2px 7px;border-radius:999px;font-weight:600}
.badge-info{background:rgba(59,130,246,.12);color:var(--info)}
.badge-primary{background:rgba(99,102,241,.12);color:var(--primary)}
.badge-success{background:rgba(34,197,94,.12);color:var(--success)}
.badge-warning{background:rgba(245,158,11,.12);color:var(--warning)}
.file-list{font-size:11px;font-family:monospace;line-height:1.6}
.file-row{display:flex;gap:6px;padding:1px 0}
.file-mark{width:18px;text-align:center;flex-shrink:0;font-weight:700}
.file-mark.M{color:var(--warning)}.file-mark.A{color:var(--success)}.file-mark.D{color:var(--error)}
.file-mark.u{color:var(--muted)}
.file-path{color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty-state{color:var(--muted);padding:16px;text-align:center;font-size:11px}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:2px}

/* ── MdViewer styles (always available even without bundle) ── */
.mdv-root{font-size:12.5px;line-height:1.7;color:#e4e4e7;word-break:break-word;overflow-wrap:anywhere}
.mdv-root h1,.mdv-root h2,.mdv-root h3{font-weight:600;margin:0.9em 0 0.35em;line-height:1.3;color:#f4f4f5}
.mdv-root h1{font-size:1.22em;border-bottom:1px solid rgba(255,255,255,.07);padding-bottom:.3em}
.mdv-root h2{font-size:1.1em}
.mdv-root h3{font-size:1em;color:#c4b5fd}
.mdv-root p{margin:0.45em 0}
.mdv-root strong{font-weight:650;color:#f4f4f5}
.mdv-root em{font-style:italic;color:#d4d4d8}
.mdv-root a{color:#818cf8;text-decoration:underline;text-underline-offset:2px}
.mdv-root hr{border:none;border-top:1px solid rgba(255,255,255,.09);margin:.9em 0}
.mdv-root ul,.mdv-root ol{padding-left:1.35em;margin:.35em 0}
.mdv-root li{margin:.18em 0}
.mdv-root blockquote{margin:.55em 0;padding:.4em .85em;border-left:3px solid rgba(139,92,246,.5);background:rgba(139,92,246,.06);border-radius:0 6px 6px 0;color:#a1a1aa;font-style:italic}
.mdv-root .mdv-inline-code,.mdv-root code:not(.hljs){font-family:monospace;font-size:.87em;background:rgba(139,92,246,.13);color:#c084fc;padding:1px 5px;border-radius:4px;border:1px solid rgba(139,92,246,.22)}
.mdv-code-block{margin:.65em 0;border-radius:8px;overflow:hidden;border:1px solid rgba(255,255,255,.08);background:#0d0d10}
.mdv-code-header{display:flex;align-items:center;justify-content:space-between;padding:4px 10px;background:rgba(255,255,255,.035);border-bottom:1px solid rgba(255,255,255,.06)}
.mdv-lang-pill{font-size:9.5px;font-family:monospace;color:rgba(255,255,255,.3);text-transform:lowercase;padding:1px 6px;background:rgba(255,255,255,.05);border-radius:10px}
.mdv-code-block pre{margin:0;padding:10px 13px;overflow-x:auto;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere}
.mdv-code-block pre code{font-family:monospace;font-size:11px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
</style>
</head>
<body>
<div class="input-area">
  <div class="input-wrap">
    <textarea id="msgInput" placeholder="Describe your changes (optional)..."></textarea>
    <button class="sparkle-btn" id="genBtn" onclick="doGenerate()">✨</button>
  </div>
</div>
<div class="dd-row">
  <span>Provider:</span><div class="dropdown-wrap" id="ddProv"></div>
  <span style="margin-left:4px">Model:</span><div class="dropdown-wrap" id="ddModel"></div>
  <button class="audit-btn" id="auditBtn" onclick="toggleAudit()" title="Toggle debug audit"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg></button>
</div>
<div class="result-area" id="resultArea"></div>
<div class="audit-area" id="auditArea"><div class="audit-card" id="auditCard"><div class="card-header"><button class="chevron-btn" onclick="toggleAuditCard()" title="Collapse/Expand"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></button><div class="card-header-actions"></div></div><div id="auditContent"></div></div></div>
<div class="splitter-wrap" id="splitterWrap">
  <div class="splitter-bar" id="splitterBar"><div class="splitter-line"></div></div>
  <div class="splitter-tip">Drag to resize &bull; Double-click to reset</div>
</div>
<div class="diff-area" id="diffArea">
<div class="empty-state">Loading git status...</div>
</div>

<script>
var vsc=acquireVsCodeApi();
var gitBranch='',gitRepo='',gitStatus='',stagedCount=0,unstagedCount=0,totalChanged=0,hasChanges=false;
var genFamily='',genModel='';
var generating=false,genText='',modelsByFamily={};
var genProvName='',genModelName='';
var genTokens=0,genElapsed=0,genTokPerSec=0;
var ddProv=null,ddModel=null;

function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}

// ── Dropdown — exact copy from settings-panel.html ──
window._ddReg={};
window._openDD=null;
function ddMake(id,opts,sel,onCh){
  var wrap=$(id);if(!wrap)return;
  var val=String(sel);var open=false;
  function refresh(){
    var found=null;
    for(var i=0;i<opts.length;i++){if(String(opts[i].v||opts[i].value)===val){found=opts[i];break}}
    var cur=found||{l:val,label:val};
    var h='<div class="dropdown-trigger sm'+(open?' open':'')+'" onclick="event.stopPropagation();window._ddReg[\''+id+'\'].toggle()"><span>'+esc(cur.l||cur.label)+'</span><span class="dropdown-arrow">▼</span></div>';
    if(open){
      h+='<div class="dropdown-menu" id="'+id+'-menu">';
      for(var i=0;i<opts.length;i++){
        var o=opts[i],ov=String(o.v||o.value);
        h+='<div class="dropdown-item'+(ov===val?' selected':'')+'" onclick="event.stopPropagation();window._ddReg[\''+id+'\'].pick(\''+ov.replace(/'/g,"\\'")+'\')">'+esc(o.l||o.label)+'</div>';
      }
      h+='</div>';
    }
    wrap.innerHTML=h;
  }
  var inst={
    get value(){return val}, set value(v){val=v;refresh();if(onCh)onCh(v)},
    setOptions:function(v){opts=v;refresh()}, get options(){return opts},
    refresh:refresh, close:function(){open=false;refresh()},
    toggle:function(){
      var prev=window._openDD;
      if(prev&&prev!==wrap&&prev._inst)prev._inst.close();
      open=!open;refresh();
      window._openDD=open?wrap:null;
    },
    pick:function(v){val=v;open=false;refresh();window._openDD=null;if(onCh)onCh(v)}
  };
  wrap._inst=inst;window._ddReg[id]=inst;refresh();return inst;
}
document.addEventListener('click',function(){
  if(window._openDD&&window._openDD._inst){window._openDD._inst.close();window._openDD=null}
});

function populateModels(){
  var list=modelsByFamily[genFamily]||[];
  var opts=list.map(function(m){return{v:m.id,l:m.name}});
  if(!opts.length)opts=[{v:'',l:'(no models)'}];
  if(!ddModel){ddModel=ddMake('ddModel',opts,opts[0].v,function(v){genModel=v})}
  else{ddModel.setOptions(opts);ddModel.value=opts[0].v;ddModel.refresh()}
  genModel=opts[0].v;
}

function updateSparkle(){
  var btn=$('genBtn'); if(!btn)return;
  if(!hasChanges){
    btn.disabled=true; btn.title='No changes to commit';
  }else if(!generating){
    btn.disabled=false; btn.title='Generate commit message';
  }
}
function doGenerate(){
  if(generating||!hasChanges)return;
  genFamily=ddProv?ddProv.value:'';
  genModel=ddModel?ddModel.value:'';
  var msg=$('msgInput').value.trim();
  generating=true;genText='';
  renderResult('loading');
  vsc.postMessage({type:'generate',payload:{uuid:genFamily,modelId:genModel,userMsg:msg}});
}

function renderDiff(){
  var d=$('diffArea');if(!d)return;
  if(!gitBranch&&!gitStatus){d.innerHTML='<div class="empty-state">No git repository detected.</div>';return}
  var h='';
  if(gitBranch||gitRepo){
    h+='<div class="badge-row">';
    if(gitBranch)h+='<span class="badge badge-info">🌿 '+esc(gitBranch)+'</span>';
    if(gitRepo)h+='<span class="badge badge-primary">📁 '+esc(gitRepo)+'</span>';
    if(totalChanged)h+='<span class="badge badge-info">📝 '+totalChanged+' files</span>';
    if(stagedCount)h+='<span class="badge badge-success">✅ '+stagedCount+' staged</span>';
    if(unstagedCount)h+='<span class="badge badge-warning">⚠ '+unstagedCount+' unstaged</span>';
    if(!stagedCount&&!unstagedCount)h+='<span class="badge" style="background:rgba(255,255,255,.05)">no changes</span>';
    h+='</div>';
  }
  if(gitStatus){
    h+='<div class="file-list">';
    gitStatus.split('\n').forEach(function(line){
      if(!line.trim())return;
      var mark=line.slice(0,2).trim(),path=line.slice(3);
      var cls='u';
      if(mark.indexOf('M')>=0)cls='M';else if(mark.indexOf('A')>=0)cls='A';else if(mark.indexOf('D')>=0)cls='D';
      h+='<div class="file-row"><span class="file-mark '+cls+'">'+esc(mark)+'</span><span class="file-path" title="'+esc(path)+'">'+esc(path)+'</span></div>';
    });h+='</div>';
  }
  d.innerHTML=h;
}

// ── Built-in Markdown renderer (always available) ──
function mdRenderFallback(text, el){
  if(!el)return;
  // Escape HTML first, then apply markdown
  var out=esc(text);
  // Fenced code blocks
  out=out.replace(/```(\w*)\n([\s\S]*?)```/g,function(_,lang,code){
    return '<div class="mdv-code-block"><div class="mdv-code-header"><span class="mdv-lang-pill">'+(lang||'text')+'</span></div><pre><code>'+code+'</code></pre></div>';
  });
  // Inline code
  out=out.replace(/`([^`]+)`/g,'<code class="mdv-inline-code">$1</code>');
  // Bold
  out=out.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  // Italic
  out=out.replace(/\*(.+?)\*/g,'<em>$1</em>');
  // Headings
  out=out.replace(/^### (.+)$/gm,'<h3>$1</h3>');
  out=out.replace(/^## (.+)$/gm,'<h2>$1</h2>');
  out=out.replace(/^# (.+)$/gm,'<h1>$1</h1>');
  // Unordered lists
  out=out.replace(/^- (.+)$/gm,'<li>$1</li>');
  out=out.replace(/(<li>.*<\/li>)/s,function(m){return '<ul>'+m+'</ul>';});
  // Blockquotes
  out=out.replace(/^> (.+)$/gm,'<blockquote><p>$1</p></blockquote>');
  // Horizontal rules
  out=out.replace(/^---$/gm,'<hr>');
  // Links
  out=out.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2">$1</a>');
  // Paragraphs: double newlines
  out=out.replace(/\n\n/g,'</p><p>');
  out='<div class="mdv-root"><p>'+out+'</p></div>';
  el.innerHTML=out;
  el.classList.add('mdv-root');
}

function renderResult(mode,errMsg){
  var d=$('resultArea'),btn=$('genBtn');if(!d)return;
  generating=false;
  updateSparkle();
  if(btn && !hasChanges){btn.disabled=true;btn.innerHTML='✨'}
  if(mode==='loading'){
    d.innerHTML='<div class="loading"><span class="spinner">⏳</span> Generating...</div>';
    generating=true;if(btn){btn.disabled=true;btn.innerHTML='<span class="spinner">⏳</span>'}
  }else if(mode==='error'){
    d.innerHTML='<div class="error">❌ '+esc(errMsg||'')+'</div>';
  }else{
    if(genText){
      var lines=genText.split('\n'),subject=lines[0]||'',body=lines.slice(1).join('\n').trim();
      // Build badge HTML
      var badgeHtml='';
      if(genProvName){
        var ph=0;for(var pi=0;pi<genProvName.length;pi++)ph=((ph<<5)-ph)+genProvName.charCodeAt(pi);
        badgeHtml+='<span class="card-badge" style="background:hsla('+(Math.abs(ph)%360)+',70%,55%,.15);color:hsl('+(Math.abs(ph)%360)+',70%,60%)">⚙ '+esc(genProvName)+'</span>';
      }
      if(genModelName){
        var mh=0;for(var mi=0;mi<genModelName.length;mi++)mh=((mh<<5)-mh)+genModelName.charCodeAt(mi);
        badgeHtml+='<span class="card-badge" style="background:hsla('+(Math.abs(mh)%360)+',70%,55%,.15);color:hsl('+(Math.abs(mh)%360)+',70%,60%)">⚙ '+esc(genModelName)+'</span>';
      }
      // Add token/time badges
      if(genTokPerSec){
        badgeHtml+='<span class="card-badge" style="background:rgba(56,189,248,.12);color:#38bdf8">⚡ '+genTokPerSec+' tok/s</span>';
      }
      if(genElapsed){
        var secs=(genElapsed/1000).toFixed(1);
        badgeHtml+='<span class="card-badge" style="background:rgba(168,85,247,.12);color:#a855f7">⏱️ '+secs+'s</span>';
      }
      if(badgeHtml)badgeHtml='<div style="display:flex;align-items:center;gap:6px">'+badgeHtml+'</div>';
      var svgCopy='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
      var svgX='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
      d.innerHTML='<div class="msg-card" id="msgCard">'
        +'<div class="card-header"><button class="chevron-btn" onclick="toggleMsgCard()" title="Collapse/Expand"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></button>'
        +'<div class="card-header-actions"><button class="action-btn copy-btn" id="copyIcon" onclick="copyResult()" title="Copy raw markdown">'+svgCopy+'</button>'
        +'<button class="action-btn clear-btn" onclick="clearResult()" title="Clear">'+svgX+'</button></div></div>'
        +'<div class="msg-scroll"><div class="msg-md-wrap" id="mdContent"></div></div>'
        +(badgeHtml?'<div class="msg-footer">'+badgeHtml+'</div>':'')
        +'</div>';
      // Render markdown: built-in fallback first, then try rich MdViewer
      var mdEl=document.getElementById('mdContent');
      if(!mdEl)return;
      mdRenderFallback(genText, mdEl);
      // Only override with MdViewer if it exists and won't break things
      if(typeof window.MdRender==='function'){
        try{ window.MdRender(genText, mdEl); }catch(e){ /* keep fallback */ }
      }
    }else{d.innerHTML=''}
  }
}

function copyResult(){
  navigator.clipboard.writeText(genText).then(function(){
    var btn=$('copyIcon');
    if(btn){
      btn.classList.add('copied');
      btn.innerHTML='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
      setTimeout(function(){btn.classList.remove('copied');btn.innerHTML='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>'},1500);
    }
  }).catch(function(){});
}
var _savedResultH=0;
function toggleMsgCard(){
  var card=$('msgCard'); if(!card)return;
  var collapsed=card.classList.toggle('collapsed');
  var ra=$('resultArea');
  if(collapsed){
    // Save current height and let card auto-size
    if(ra){_savedResultH=ra.style.height; ra.style.height='auto'; ra.style.flexShrink='0'}
  }else{
    // Restore height
    if(ra&&_savedResultH){ra.style.height=_savedResultH; ra.style.flexShrink='0'}
  }
}
function clearResult(){genText='';$('resultArea').innerHTML=''}
var genTraceData='',auditOpen=false;
function toggleAudit(){
  auditOpen=!auditOpen;
  var btn=$('auditBtn'),area=$('auditArea'),ac=$('auditContent');
  if(btn)btn.classList.toggle('active',auditOpen);
  if(area)area.classList.toggle('show',auditOpen);
  if(auditOpen && ac && typeof window.MdRender==='function'){
    mdRenderFallback(genTraceData||'*No trace data yet.*', ac);
    if(typeof window.MdRender==='function'){ try{window.MdRender(genTraceData||'*No trace data yet.*', ac);}catch(e){} }
  }
}
function toggleAuditCard(){
  var card=$('auditCard'); if(!card)return;
  card.classList.toggle('collapsed');
}

// Splitter — default 40%, max result = innerHeight-350px, min 10px
(function(){
  var bar=document.getElementById("splitterBar");
  var ra=document.getElementById("resultArea");
  var ta=document.getElementById("diffArea");
  if(!bar||!ra||!ta)return;
  var drag=false,startY=0,startH=0;
  function apply(h){if(h<350)h=350;if(h>window.innerHeight-350)h=window.innerHeight-350;ra.style.height=h+"px";ra.style.flexShrink="0";ta.style.flex="1 1 0%"}
  bar.addEventListener("mousedown",function(e){e.preventDefault();drag=true;startY=e.clientY;startH=ra.getBoundingClientRect().height;bar.classList.add("dragging")});
  document.addEventListener("mousemove",function(e){if(!drag)return;apply(startH+e.clientY-startY)});
  document.addEventListener("mouseup",function(){if(drag){drag=false;bar.classList.remove("dragging")}});
  bar.addEventListener("dblclick",function(){apply(window.innerHeight*0.4)});
  apply(window.innerHeight*0.4);
})();

window.addEventListener('message',function(e){
  var p=e.data.payload||{},t=e.data.type;
  if(t==='gitData'){
    gitBranch=p.branch||'';gitRepo=p.repo||'';gitStatus=p.statusShort||'';
    stagedCount=p.stagedCount||0;unstagedCount=p.unstagedCount||0;totalChanged=p.totalChanged||p.stagedCount+p.unstagedCount||0;
    hasChanges=totalChanged>0; updateSparkle();
    renderDiff();
  }else if(t==='providers'){
    var fams=p.families||[];
    var popts=fams.map(function(f){return{v:f.uuid,l:f.name}});
    if(!ddProv){ddProv=ddMake('ddProv',popts,popts[0]?popts[0].v:'',function(v){genFamily=v;populateModels()})}
    else{ddProv.setOptions(popts);ddProv.value=popts[0]?popts[0].v:'';ddProv.refresh()}
    genFamily=popts[0]?popts[0].v:'';
    populateModels();
  }else if(t==='models'){
    modelsByFamily=p.modelsByFamily||{};
    populateModels();
  }else if(t==='genToken'){
    genText+=e.data.payload;
  }else if(t==='genResult'){
    generating=false;
    var b=$('genBtn');if(b){b.innerHTML='✨'}
    updateSparkle();
    genProvName=p.provider||'';genModelName=p.model||'';
    genTokens=p.tokens||0; genElapsed=p.elapsedMs||0; genTokPerSec=p.tokPerSec||0;
    genTraceData=p.trace||'*No trace data available.*';
    // If audit is open, refresh it with new trace
    if(auditOpen){ var ac=$('auditContent'); if(ac){mdRenderFallback(genTraceData,ac); if(typeof window.MdRender==='function'){try{window.MdRender(genTraceData,ac);}catch(e){}} } }
    if(p.error){genText='';renderResult('error',p.error)}
    else{genText=p.text||genText;renderResult('')}
  }
});

vsc.postMessage({type:'getData'});
</script>
