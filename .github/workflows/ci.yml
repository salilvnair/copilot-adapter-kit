name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            webview-ui/package-lock.json

      - run: npm ci
      - run: npm ci --prefix webview-ui

      - name: Type-check the extension and the webview
        run: npm run typecheck

      # Compiles first, because the suites exercise the built output in out/
      # and the webview bundle in media/dist.
      - name: Unit and contract suites
        run: npm test

      - name: Install the browser Playwright drives
        run: npx --prefix webview-ui playwright install --with-deps chromium

      - name: End-to-end suite
        run: npm run test:e2e

      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: webview-ui/playwright-report/
          retention-days: 7
